name: Deploy frontend sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Builder le site
        run: npm run build
        env:
          # Sous GitHub Pages, /<nom-du-repo>/ est le sous-chemin de publication.
          VITE_BASE: /${{ github.event.repository.name }}/
          # URL de l'API backend (à définir dans Settings > Secrets and variables > Actions)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload l'artefact (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
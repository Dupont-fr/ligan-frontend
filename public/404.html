<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>LIGAN+</title>
  </head>
  <body>
    <script>
      // GitHub Pages sert 404.html pour toute route inconnue (ex. /business/garage-autopro-dschang).
      // On sauvegarde le chemin demandé puis on recharge l'index : React Router (Sprint 1)
      // restaurera la route via sessionStorage('ligan:redirect').
      sessionStorage.setItem('ligan:redirect', window.location.pathname + window.location.search)
      window.location.replace('./')
    </script>
  </body>
</html>

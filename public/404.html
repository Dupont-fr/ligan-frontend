<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>LIGAN+</title>
  </head>
  <body>
    <script>
      // Hebergement statique : 404.html sert toute route inconnue (ex. /business/ma-fiche).
      // On garde l'adresse demandee puis on recharge l'accueil du SPA ; App.tsx
      // restaure cette adresse via sessionStorage('ligan:redirect') et React Router
      // affiche alors la page 404 personnalisee.
      sessionStorage.setItem('ligan:redirect', window.location.pathname + window.location.search)
      window.location.replace('/')
    </script>
  </body>
</html>

# =============================================================================
# Configuration Nginx du frontend LIGAN+ (a l'interieur du conteneur).
#
# Deux roles :
#   1) servir l'application React (SPA) : toute URL inconnue renvoie index.html
#      (sinon un rafraichissement sur /trouver renverrait une erreur 404) ;
#   2) relayer (proxy) les appels /api et les photos /uploads vers le conteneur
#      backend "api". Le navigateur ne parle donc qu'a UNE seule origine
#      (http://localhost:8080) -> pas de souci de CORS ni de cookies.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolution DNS "a chaud" des noms de services Docker (ex. "api").
    # 127.0.0.11 = le DNS interne de Docker. L'astuce du "resolver" + variable
    # permet a Nginx de demarrer meme si le backend n'est pas encore pret,
    # et de re-resoudre l'adresse si le conteneur redemarre.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5000;

    # --- Compression des reponses texte --------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Fichiers compiles par Vite (nom avec empreinte) : cache long --------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API backend (meme origine) ------------------------------------------
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Certaines operations (emails, IA) peuvent etre un peu longues.
        proxy_read_timeout 120s;
    }

    # --- Photos stockees cote backend ----------------------------------------
    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Service worker / manifeste : toujours revalides ---------------------
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # --- Application React (SPA) ---------------------------------------------
    # Essaie le fichier demande ; sinon renvoie index.html (routage cote client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
